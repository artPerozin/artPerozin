name: Cards de estatísticas

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: perfil

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Baixar github-readme-stats (versão fixa)
        run: |
          git clone https://github.com/anuraghazra/github-readme-stats.git perfil/github-readme-stats
          git -C perfil/github-readme-stats checkout 54a7985aeefda00d5eadb55b80c17c7f976c37d2
          cd perfil/github-readme-stats && npm ci --omit=dev

      - name: Gerar SVGs
        working-directory: perfil
        env:
          PAT_1: ${{ secrets.GH_STATS_TOKEN }}
        run: node scripts/gen-cards.mjs

      - name: Publicar na branch output
        working-directory: perfil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin output
          git checkout -f output
          cp out/*.svg .
          git add stats.svg langs.svg
          if ! git diff --cached --quiet; then git commit -m "Atualiza cards" && git push origin output; fi
